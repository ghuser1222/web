<title>你是人间的四月天 · 林徽因</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #faf6ef;
    color: #3a3226;
    font-family: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
    line-height: 1.9;
    -webkit-font-smoothing: antialiased;
  }
  main {
    max-width: 620px;
    margin: 0 auto;
    padding: 72px 24px 64px;
  }
  header { text-align: center; margin-bottom: 56px; }
  h1 {
    font-size: 30px;
    font-weight: 600;
    letter-spacing: 0.12em;
    color: #2e2620;
  }
  .subtitle {
    margin-top: 10px;
    font-size: 15px;
    letter-spacing: 0.28em;
    color: #8a7a63;
  }
  .author {
    margin-top: 18px;
    font-size: 16px;
    letter-spacing: 0.4em;
    color: #a86f3c;
    text-indent: 0.4em;
  }
  .rule {
    width: 36px;
    height: 2px;
    background: #d9b98c;
    margin: 28px auto 0;
  }

  .stanza p {
    font-size: 18px;
    letter-spacing: 0.06em;

    margin-top: 64px;

<body>
<main>
  <header>
    <h1>你是人间的四月天</h1>
    <p class="subtitle">——一句爱的赞颂</p>
    <p class="author">林徽因</p>
    <div class="rule"></div>
  </header>

  <div class="stanza">
    <p>我说你是人间的四月天；</p>
    <p>笑响点亮了四面风；轻灵</p>
    <p>在春的光艳中交舞着变。</p>
  </div>

  <div class="stanza">
    <p>你是四月早天里的云烟，</p>
    <p>黄昏吹着风的软，星子在</p>
    <p>无意中闪，细雨点洒在花前。</p>
  </div>

  <div class="stanza">
    <p>那轻，那娉婷，你是，鲜妍</p>
    <p>百花的冠冕你戴着，你是</p>
    <p>天真，庄严，你是夜夜的月圆。</p>
  </div>

  <div class="stanza">
    <p>雪化后那片鹅黄，你像；新鲜</p>
    <p>初放芽的绿，你是；柔嫩喜悦</p>
    <p>水光浮动着你梦期待中白莲。</p>
  </div>

  <div class="stanza">
    <p>你是一树一树的花开，是燕</p>
    <p>在梁间呢喃，——你是爱，是暖，</p>
    <p>是希望，你是人间的四月天！</p>
  </div>

  <footer>mihoutao · 1934</footer>
</main>
</body>
</html>
